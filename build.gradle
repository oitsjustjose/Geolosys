plugins {
    id "com.modrinth.minotaur" version "2.+"
    id "com.matthewprenger.cursegradle" version "1.4.0+"
    id "net.neoforged.gradle" version "[6.0.18,6.2)"
}

group = 'com.oitsjustjose.geolosys' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
version = "${mod_version}"
base { archivesName = "Geolosys-${game_version}-${mod_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: "${game_version}"
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { geolosys { source sourceSets.main } }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { geolosys { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft "net.neoforged:forge:${game_version}-${neo_version}"
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
                "Specification-Title"     : "Geolosys",
                "Specification-Vendor"    : "oitsjustjose.com",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${mod_version}",
                "Implementation-Vendor"   : "oitsjustjose.com",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('publish') {
    dependsOn 'curseforge'
    dependsOn 'modrinth'
}

curseforge {
    apiKey = project.hasProperty("CURSEFORGE_API_KEY") ? project.CURSEFORGE_API_KEY : ""
    project {
        id = '271856'
        changelogType = 'markdown'
        changelog = file("./changelog.md")
        releaseType = "${mod_release_type}"
        addGameVersion "${game_version}"
        mainArtifact(jar) {
            displayName = "Geolosys ${game_version} ${mod_version}"
        }
    }
}

modrinth {
    token = project.hasProperty("MODRINTH_TOKEN") ? project.MODRINTH_TOKEN : ""
    projectId = "aPBZx3jD"
    versionName = "Geolosys ${game_version} ${mod_version}"
    versionNumber = "${game_version}-${mod_version}"
    versionType = "${mod_release_type}"
    uploadFile = jar
    gameVersions = ["${game_version}"]
    loaders = ["forge"]
    changelog = file("./changelog.md").text
    dependencies { optional.project "patchouli" }
}
